name: APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      - name: Tests ausführen & Debug-APK bauen
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Kurzen Commit-Hash ermitteln
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: APK für Veröffentlichung vorbereiten
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/schmuddelwetter-debug-${{ steps.vars.outputs.sha_short }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/schmuddelwetter-debug-latest.apk

      - name: APK als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: schmuddelwetter-debug-apk
          path: dist/schmuddelwetter-debug-${{ steps.vars.outputs.sha_short }}.apk
          retention-days: 30

      - name: "Release 'Letzter Debug-Build' aktualisieren"
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug-build --yes --cleanup-tag || true
          gh release create latest-debug-build dist/schmuddelwetter-debug-latest.apk \
            --title "Letzter Debug-Build" \
            --prerelease \
            --notes "Automatisch gebauter Debug-APK.

          - Branch: \`${{ github.ref_name }}\`
          - Commit: ${{ github.sha }}

          Zum Installieren am Handy: Datei unten (\`schmuddelwetter-debug-latest.apk\`) herunterladen und öffnen. Android fragt ggf. nach der Erlaubnis \"Apps aus unbekannten Quellen installieren\" – für die Browser-/Dateien-App einmalig zulassen."
