name: DWD Debug (temporär)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: All-Stations-KMZ laden und Struktur prüfen
        run: |
          set -x
          curl -sSL -o full.kmz "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/all_stations/kml/MOSMIX_S_LATEST_240.kmz" -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          ls -la full.kmz
          mkdir -p extracted
          unzip -o full.kmz -d extracted
          ls -la extracted
          KML=$(find extracted -iname "*.kml" | head -1)
          echo "KML=$KML"
          ls -la "$KML"

          echo "=== ERSTE 4000 ZEICHEN ==="
          head -c 4000 "$KML"
          echo ""
          echo "=== ZEICHEN 4000-20000 ==="
          tail -c +4000 "$KML" | head -c 16000
          echo ""
          echo "=== unique elementName Werte (erste 300000 Zeichen) ==="
          head -c 300000 "$KML" | grep -oE 'elementName="[A-Za-z0-9]+"' | sort -u
          echo "=== TimeStep Beispiele ==="
          head -c 300000 "$KML" | grep -oE '<[a-zA-Z0-9:]*TimeStep>[^<]*' | head -5
          echo "=== coordinates Beispiele ==="
          head -c 300000 "$KML" | grep -oE '<[a-zA-Z0-9:]*coordinates>[^<]*' | head -5
          echo "=== name-Tags Beispiele ==="
          head -c 300000 "$KML" | grep -oE '<[a-zA-Z0-9:]*name>[^<]*' | head -10
          echo "=== Placemark-Tag Beispiele ==="
          head -c 300000 "$KML" | grep -oE '<[a-zA-Z0-9:]*Placemark[^>]*>' | head -5
          echo "=== Gesamtzahl Placemarks ==="
          grep -oE "<[a-zA-Z0-9:]*Placemark>" "$KML" | wc -l
