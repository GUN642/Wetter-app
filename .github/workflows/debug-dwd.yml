name: DWD Debug (temporär)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stationskatalog abrufen (Kopf)
        run: |
          set -x
          curl -sS -D - -o catalog.txt "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/mosmix_stationskatalog.cfg" | head -30
          echo "--- Dateigröße ---"
          wc -l catalog.txt
          echo "--- Erste 40 Zeilen ---"
          head -40 catalog.txt
          echo "--- Zeilen mit '10637' (Frankfurt) ---"
          grep -n "10637" catalog.txt | head -5 || echo "nicht gefunden"

      - name: Verzeichnis der single_stations auflisten
        run: |
          set -x
          curl -sS -o listing.html "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/single_stations/"
          grep -oE '"[0-9A-Za-z_.-]+/"' listing.html | head -20 || true
          echo "--- Verzeichnis für 10637 ---"
          curl -sS -o dir10637.html "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/single_stations/10637/kml/" || true
          cat dir10637.html | head -50 || true

      - name: KMZ für Frankfurt (10637) laden und Struktur prüfen
        run: |
          set -x
          curl -sSL -o test.kmz "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/single_stations/10637/kml/MOSMIX_S_LATEST_10637.kmz" -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          file test.kmz
          unzip -l test.kmz || true
          mkdir -p extracted
          unzip -o test.kmz -d extracted || true
          ls -la extracted
          KML_FILE=$(find extracted -iname "*.kml" | head -1)
          echo "KML_FILE=$KML_FILE"
          if [ -n "$KML_FILE" ]; then
            echo "--- Erste 3000 Zeichen ---"
            head -c 3000 "$KML_FILE"
            echo ""
            echo "--- Suche nach Placemark/Forecast/ElementName ---"
            grep -o '<[a-zA-Z0-9:]*Placemark[^>]*>' "$KML_FILE" | head -5
            grep -o 'elementName="[A-Za-z0-9]*"' "$KML_FILE" | sort -u | head -60
            grep -o '<[a-zA-Z0-9:]*TimeStep>' "$KML_FILE" | head -3
          fi
