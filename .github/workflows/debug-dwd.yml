name: DWD Debug (temporär)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verzeichnisstruktur erkunden
        run: |
          set -x
          for url in \
            "https://opendata.dwd.de/weather/local_forecasts/mos/" \
            "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/" \
            "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/single_stations/" \
            "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/all_stations/" \
            "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/all_stations/kml/" \
            ; do
            echo "=================================================="
            echo "URL: $url"
            code=$(curl -sS -o /tmp/page.html -w "%{http_code}" "$url")
            echo "HTTP: $code"
            if [ "$code" = "200" ]; then
              echo "--- Auszug (erste 60 Zeilen) ---"
              head -60 /tmp/page.html
            fi
          done

      - name: Nach Stationskatalog-Dateien suchen
        run: |
          set -x
          curl -sS -o /tmp/mos.html "https://opendata.dwd.de/weather/local_forecasts/mos/"
          echo "--- Alle href in mos/ ---"
          grep -oE 'href="[^"]+"' /tmp/mos.html
          curl -sS -o /tmp/mosmix_s.html "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/"
          echo "--- Alle href in MOSMIX_S/ ---"
          grep -oE 'href="[^"]+"' /tmp/mosmix_s.html

      - name: all_stations kml Verzeichnis auflisten (Dateinamen-Muster)
        run: |
          set -x
          curl -sS -o /tmp/allkml.html "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/all_stations/kml/"
          grep -oE 'href="[^"]+"' /tmp/allkml.html | head -20

      - name: single_stations Verzeichnis roh ausgeben
        run: |
          set -x
          curl -sS -D - -o /tmp/single.html "https://opendata.dwd.de/weather/local_forecasts/mos/MOSMIX_S/single_stations/"
          echo "--- Inhalt ---"
          cat /tmp/single.html
